<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AI-Optimized Quantum Circuit Compiler{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-100 min-h-screen">
    <nav class="bg-blue-600 text-white shadow-lg">
        <div class="container mx-auto px-4 py-3">
            <div class="flex justify-between items-center">
                <h1 class="text-xl font-bold">Quantum Circuit RL Compiler</h1>
                <div class="space-x-4">
                    <a href="/" class="hover:text-blue-200">Home</a>
                    <a href="/circuit" class="hover:text-blue-200">Circuits</a>
                    <a href="/train" class="hover:text-blue-200">Train</a>
                    <a href="/results" class="hover:text-blue-200">Results</a>
                    <a href="/test" class="hover:text-blue-200">Test</a>
                </div>
            </div>
        </div>
    </nav>
    
    <main class="container mx-auto px-4 py-8">
        {% block content %}{% endblock %}
    </main>
    
    <footer class="bg-gray-800 text-white text-center py-4 mt-8">
        <p>&copy; 2024 AI-Optimized Quantum Circuit Compiler</p>
    </footer>
</body>
</html>
